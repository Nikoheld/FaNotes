<!-- Synthetic TAM intranet sign-in page (school "bmz"), shaped like the public login markup. The
     hash and csrf values are invented. -->

<script>var school='bmz', baseUrl='/', csrfToken='0000aaaa1111bbbb2222cccc3333dddd';</script></head>
<body>
<form name="login-form" class="login-form showForm" action="/bmz" method="post" accept-charset="UTF-8">
  <input type="hidden" name="hash" value="0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f.12345678"/>

</form>
<a href="https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=00000000-0000-0000-0000-000000000000&amp;redirect_uri=https://intranet.tam.ch/auth/azure&amp;state=x">Microsoft</a>
