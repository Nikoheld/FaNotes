name: Release

# A called workflow still reports the caller's event name, so inputs are read
# directly. Tag pushes leave inputs empty and use github.sha and github.ref_name.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Calendar version without a leading v
        required: true
        type: string
      sha:
        description: Commit that contains this version
        required: true
        type: string

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  CI: 'true'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fanotes/package-lock.json
      - name: Install AppImage tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xz-utils
      - name: Install dependencies
        working-directory: fanotes
        run: npm ci
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('fanotes/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Network retry helper
        shell: bash
        run: |
          # A build is retried only when its log shows a network failure
          # (GitHub release downloads, Gradle, Maven). Real build errors fail at once.
          cat > "$RUNNER_TEMP/retry-network.sh" <<'SH'
          retry_network() {
            local attempt=1 max=4 log status errexit=0
            case $- in *e*) errexit=1 ;; esac
            while :; do
              log="$(mktemp)"
              set +e
              "$@" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              if [ "$errexit" -eq 1 ]; then set -e; fi
              if [ "$status" -eq 0 ]; then rm -f "$log"; return 0; fi
              if [ "$attempt" -ge "$max" ] || ! grep -Eqi '(response code|status code|HTTP/[0-9.]+|HTTP|returned HTTP response code:?) ?50[234]|Gateway Time-?out|Bad Gateway|Service Unavailable|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|socket hang up|Read timed out|Connection reset|Could not (GET|HEAD|download)' "$log"; then
                rm -f "$log"; return "$status"
              fi
              rm -f "$log"
              echo "::warning::Network error during the build (attempt ${attempt}/${max}). Retrying in $((attempt * 120)) s."
              sleep $((attempt * 120))
              attempt=$((attempt + 1))
            done
          }
          SH
      - name: Build Linux packages
        working-directory: fanotes
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/retry-network.sh"
          retry_network npm run dist:linux:ci
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          if-no-files-found: error
          path: |
            fanotes/release/FaNotes-*-x86_64.AppImage
            fanotes/release/FaNotes-*-x86_64.tar.gz

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fanotes/package-lock.json
      - name: Install dependencies
        working-directory: fanotes
        run: npm ci
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('fanotes/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Network retry helper
        shell: bash
        run: |
          # A build is retried only when its log shows a network failure
          # (GitHub release downloads, Gradle, Maven). Real build errors fail at once.
          cat > "$RUNNER_TEMP/retry-network.sh" <<'SH'
          retry_network() {
            local attempt=1 max=4 log status errexit=0
            case $- in *e*) errexit=1 ;; esac
            while :; do
              log="$(mktemp)"
              set +e
              "$@" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              if [ "$errexit" -eq 1 ]; then set -e; fi
              if [ "$status" -eq 0 ]; then rm -f "$log"; return 0; fi
              if [ "$attempt" -ge "$max" ] || ! grep -Eqi '(response code|status code|HTTP/[0-9.]+|HTTP|returned HTTP response code:?) ?50[234]|Gateway Time-?out|Bad Gateway|Service Unavailable|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|socket hang up|Read timed out|Connection reset|Could not (GET|HEAD|download)' "$log"; then
                rm -f "$log"; return "$status"
              fi
              rm -f "$log"
              echo "::warning::Network error during the build (attempt ${attempt}/${max}). Retrying in $((attempt * 120)) s."
              sleep $((attempt * 120))
              attempt=$((attempt + 1))
            done
          }
          SH
      - name: Build Windows packages
        working-directory: fanotes
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/retry-network.sh"
          retry_network npm run dist:windows:ci
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: error
          path: |
            fanotes/release/FaNotes-Setup-*-x64.exe
            fanotes/release/FaNotes-Portable-*-x64.exe

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager closes the license pipe early. pipefail would turn that into a failed job.
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Module build files change with every version bump; only the
          # wrapper and the settings decide what is downloaded.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Network retry helper
        shell: bash
        run: |
          # A build is retried only when its log shows a network failure
          # (GitHub release downloads, Gradle, Maven). Real build errors fail at once.
          cat > "$RUNNER_TEMP/retry-network.sh" <<'SH'
          retry_network() {
            local attempt=1 max=4 log status errexit=0
            case $- in *e*) errexit=1 ;; esac
            while :; do
              log="$(mktemp)"
              set +e
              "$@" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              if [ "$errexit" -eq 1 ]; then set -e; fi
              if [ "$status" -eq 0 ]; then rm -f "$log"; return 0; fi
              if [ "$attempt" -ge "$max" ] || ! grep -Eqi '(response code|status code|HTTP/[0-9.]+|HTTP|returned HTTP response code:?) ?50[234]|Gateway Time-?out|Bad Gateway|Service Unavailable|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|socket hang up|Read timed out|Connection reset|Could not (GET|HEAD|download)' "$log"; then
                rm -f "$log"; return "$status"
              fi
              rm -f "$log"
              echo "::warning::Network error during the build (attempt ${attempt}/${max}). Retrying in $((attempt * 120)) s."
              sleep $((attempt * 120))
              attempt=$((attempt + 1))
            done
          }
          SH
      - name: Test and build the Android app
        working-directory: android
        env:
          FANOTES_ANDROID_KEYSTORE_B64: ${{ secrets.FANOTES_ANDROID_KEYSTORE_B64 }}
          FANOTES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FANOTES_ANDROID_KEYSTORE_PASSWORD }}
          FANOTES_ANDROID_KEY_PASSWORD: ${{ secrets.FANOTES_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "${FANOTES_ANDROID_KEYSTORE_B64}" ] || [ -z "${FANOTES_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "The Android release keystore is not configured." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/fanotes-release.keystore"
          printf '%s' "$FANOTES_ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          export FANOTES_ANDROID_KEYSTORE="$keystore"
          version="$(node -p "require('../fanotes/package.json').version")"
          source "$RUNNER_TEMP/retry-network.sh"
          retry_network ./gradlew :core:test :app:assembleRelease -Pfanotes.version="$version" --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 29 "$apk"
          cp "$apk" "FaNotes-${version}-android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          if-no-files-found: error
          path: android/FaNotes-*-android.apk

  android-companion:
    name: Android Companion
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager closes the license pipe early. pipefail would turn that into a failed job.
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Module build files change with every version bump; only the
          # wrapper and the settings decide what is downloaded.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Network retry helper
        shell: bash
        run: |
          # A build is retried only when its log shows a network failure
          # (GitHub release downloads, Gradle, Maven). Real build errors fail at once.
          cat > "$RUNNER_TEMP/retry-network.sh" <<'SH'
          retry_network() {
            local attempt=1 max=4 log status errexit=0
            case $- in *e*) errexit=1 ;; esac
            while :; do
              log="$(mktemp)"
              set +e
              "$@" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              if [ "$errexit" -eq 1 ]; then set -e; fi
              if [ "$status" -eq 0 ]; then rm -f "$log"; return 0; fi
              if [ "$attempt" -ge "$max" ] || ! grep -Eqi '(response code|status code|HTTP/[0-9.]+|HTTP|returned HTTP response code:?) ?50[234]|Gateway Time-?out|Bad Gateway|Service Unavailable|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|socket hang up|Read timed out|Connection reset|Could not (GET|HEAD|download)' "$log"; then
                rm -f "$log"; return "$status"
              fi
              rm -f "$log"
              echo "::warning::Network error during the build (attempt ${attempt}/${max}). Retrying in $((attempt * 120)) s."
              sleep $((attempt * 120))
              attempt=$((attempt + 1))
            done
          }
          SH
      - name: Firebase config when the secret exists
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > companion/google-services.json
          fi
      - name: Test Schulnetz logic and build the companion
        working-directory: android
        env:
          FANOTES_ANDROID_KEYSTORE_B64: ${{ secrets.FANOTES_ANDROID_KEYSTORE_B64 }}
          FANOTES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FANOTES_ANDROID_KEYSTORE_PASSWORD }}
          FANOTES_ANDROID_KEY_PASSWORD: ${{ secrets.FANOTES_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          node --test ../fanotes-site/schulnetz-logic.test.mjs ../fanotes-site/sync-guard.test.mjs ../fanotes-site/kanti-web-api.test.mjs ../fanotes-site/absence-points.test.mjs ../fanotes-site/poll-schedule.test.mjs ../fanotes-site/grade-sla.test.mjs ../fanotes-site/mensa.test.mjs
          if [ -z "${FANOTES_ANDROID_KEYSTORE_B64}" ] || [ -z "${FANOTES_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "The Android release keystore is not configured." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/fanotes-release.keystore"
          printf '%s' "$FANOTES_ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          export FANOTES_ANDROID_KEYSTORE="$keystore"
          version="$(node -p "require('../fanotes/package.json').version")"
          # Play needs a higher versionCode for every upload. The code comes from
          # the calendar version, which only moves forward.
          version_code="$(node ../fanotes/scripts/android-version-code.mjs "$version")"
          source "$RUNNER_TEMP/retry-network.sh"
          retry_network ./gradlew :core:test --tests ch.fasrv.fanotes.schulnetz.* :companion:assembleRelease :companion:bundleRelease -Pfanotes.version="$version" --stacktrace
          apk="companion/build/outputs/apk/release/companion-release.apk"
          aab="companion/build/outputs/bundle/release/companion-release.aab"
          symbols="companion/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 29 "$apk"
          # sed and grep -c read all input, so pipefail never sees a SIGPIPE.
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | sed -n '1p')"
          echo "$badging"
          case "$badging" in
            *"name='ch.fasrv.kantiplus' versionCode='${version_code}' versionName='${version}' "*) ;;
            *) echo "Kanti+ must be built as versionCode ${version_code}, versionName ${version}." >&2; exit 1 ;;
          esac
          symbol_tables="$(unzip -Z1 "$aab" | grep -c '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/.*\.so\.sym$' || true)"
          if [ "$symbol_tables" -eq 0 ]; then
            echo "The Kanti+ bundle has no native debug symbols." >&2
            exit 1
          fi
          echo "Native symbol tables in the bundle: ${symbol_tables}"
          cp "$apk" "Kanti-Plus-${version}-android.apk"
          cp "$aab" "Kanti-Plus-${version}-android.aab"
          cp "$symbols" "Kanti-Plus-${version}-native-debug-symbols.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: android-companion
          if-no-files-found: error
          path: |
            android/Kanti-Plus-*-android.apk
            android/Kanti-Plus-*-android.aab
            android/Kanti-Plus-*-native-debug-symbols.zip

  publish:
    name: Publish GitHub release
    needs: [linux, windows, android, android-companion]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Sign update manifests
        working-directory: fanotes
        env:
          FANOTES_UPDATE_SIGNING_KEY: ${{ secrets.FANOTES_UPDATE_SIGNING_KEY }}
        run: node scripts/write-update-manifests.mjs --dir "$GITHUB_WORKSPACE/dist-artifacts" --version "${RELEASE_VERSION#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          notes="$(mktemp)"
          awk -v version="$version" '
            $0 == "## " version { keep = 1; next }
            keep && $0 ~ /^## / { exit }
            keep { print }
          ' fanotes/CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then echo "FaNotes ${version}" > "$notes"; fi
          if [[ "$version" == *-beta.* ]]; then
            release_flags=(--prerelease=true --latest=false)
          else
            release_flags=(--prerelease=false)
          fi
          # Every command is checked explicitly: set -e does not apply inside
          # a function that runs as an if condition. All steps are idempotent.
          publish() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist-artifacts/* --clobber || return 1
            else
              gh release create "$tag" dist-artifacts/* --title "FaNotes ${version}" --notes-file "$notes" --verify-tag "${release_flags[@]}" || return 1
            fi
            gh release edit "$tag" --draft=false --title "FaNotes ${version}" --notes-file "$notes" "${release_flags[@]}" || return 1
          }
          for attempt in 1 2 3 4; do
            if publish; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "::warning::Publishing failed (attempt ${attempt}/4). Retrying in $((attempt * 60)) s."
            sleep $((attempt * 60))
          done
