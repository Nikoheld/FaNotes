name: Android Companion

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install poppler and qpdf (timetable PDF pipeline test)
        # The runner's apt mirror sometimes fails DNS for minutes. The pipeline test skips without
        # these tools, so a failed install must neither block nor fail the build.
        timeout-minutes: 4
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 poppler-utils qpdf; then exit 0; fi
            echo "apt attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Schulnetz unit tests
        run: |
          node --test fanotes-site/schulnetz-logic.test.mjs fanotes-site/sync-guard.test.mjs fanotes-site/schulnetz-i18n.test.mjs fanotes-site/kanti-web-api.test.mjs fanotes-site/absence-points.test.mjs fanotes-site/poll-schedule.test.mjs fanotes-site/grade-sla.test.mjs fanotes-site/mensa.test.mjs fanotes-site/class-timetables.test.mjs fanotes-site/lesson-marks.test.mjs
          node fanotes/scripts/android-version-code.mjs --self-test
      - name: Kanti+ web app (schulnetz.fasrv.ch)
        working-directory: fanotes-site/kanti-web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Kanti+ web app end-to-end (Playwright, local full stack)
        working-directory: fanotes-site/kanti-web
        run: |
          # --with-deps goes through apt, whose mirror sometimes fails DNS on the runner; the
          # ubuntu image already has Chromium's libraries, so fall back to the browser alone.
          timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
          npm run e2e
      - name: Firebase config when the secret exists
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > companion/google-services.json
          fi
      - name: Core tests and companion debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :core:test :companion:testDebugUnitTest :companion:assembleDebug --stacktrace
          cp companion/build/outputs/apk/debug/companion-debug.apk Kanti-Plus-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Kanti-Plus-debug
          if-no-files-found: error
          path: android/Kanti-Plus-debug.apk
