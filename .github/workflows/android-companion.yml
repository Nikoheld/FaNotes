name: Android Companion

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Schulnetz unit tests
        run: node --test fanotes-site/schulnetz-logic.test.mjs fanotes-site/sync-guard.test.mjs fanotes-site/schulnetz-i18n.test.mjs
      - name: Firebase config when the secret exists
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > companion/google-services.json
          fi
      - name: Core tests and companion debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :core:test :companion:assembleDebug --stacktrace
          cp companion/build/outputs/apk/debug/companion-debug.apk Kanti-Plus-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Kanti-Plus-debug
          if-no-files-found: error
          path: android/Kanti-Plus-debug.apk
