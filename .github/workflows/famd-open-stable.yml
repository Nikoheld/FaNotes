name: Handwriting note opens stable

# Opening a .famd note in the desktop app (Electron under Xvfb): the first
# painted frame already has the final layout - typed text, page box, text
# boxes - and opening never moves a stored text box
# (fanotes/scripts/check-famd-open-stable.mjs, under a minute). The handwriting
# is complete from that first frame too - no blank, partial, flashing or moved
# ink frame on any open, opening writes no note, and opens stay inside their
# time budget (fanotes/scripts/check-ink-open-flicker.mjs, about a minute).
# Another step drives text boxes (fanotes/scripts/check-text-field-position.mjs,
# about a minute): dragging never selects text, and boxes stay where they were
# left. Zooming keeps the handwriting on the paper in every frame, at device
# pixel ratio 2 and 1: no moved, stretched or missing ink while or after a
# pinch, wheel, keyboard or button zoom, the sharp page within its budget and
# the zoom percentage in step with the picture
# (fanotes/scripts/check-zoom-ink-registration.mjs, about three minutes).
# Zooming a note with 48 sections and heavy handwriting does not re-render the
# section bands and does not restyle the bands far from the view, without a
# main-thread task over its budget (fanotes/scripts/check-zoom-sections-perf.mjs,
# about two minutes).
# Never builds or publishes a release.
on:
  pull_request:
    paths:
      - 'fanotes/src/App.tsx'
      - 'fanotes/src/components/PaperView.tsx'
      - 'fanotes/src/components/DrawingBoard.tsx'
      - 'fanotes/src/components/MarkdownEditor.tsx'
      - 'fanotes/src/components/NoteTextFieldLayer.tsx'
      - 'fanotes/src/components/NoteLinkLayer.tsx'
      - 'fanotes/src/components/InkPreviewLayer.tsx'
      - 'fanotes/src/lib/packedInk.ts'
      - 'fanotes/src/lib/inkBitmapCache.ts'
      - 'fanotes/src/lib/inkWindowPlan.ts'
      - 'fanotes/src/lib/inkRepaintJob.ts'
      - 'fanotes/src/lib/paper*.ts'
      - 'fanotes/src/lib/noteCanvas.ts'
      - 'fanotes/src/lib/noteTextField.ts'
      - 'fanotes/src/lib/pdfOpenCamera.ts'
      - 'fanotes/src/styles.css'
      - 'fanotes/electron/famd*'
      - 'fanotes/src/components/FormattingToolbar.tsx'
      - 'fanotes/src/components/NoteTextFieldMarkdown.tsx'
      - 'fanotes/src/lib/noteTextFieldFormat.ts'
      - 'fanotes/scripts/check-famd-open-stable.mjs'
      - 'fanotes/scripts/check-ink-open-flicker.mjs'
      - 'fanotes/scripts/check-text-field-position.mjs'
      - 'fanotes/scripts/check-text-field-toolbar.mjs'
      - 'fanotes/scripts/check-zoom-ink-registration.mjs'
      - 'fanotes/scripts/check-zoom-sections-perf.mjs'
      - '.github/workflows/famd-open-stable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fanotes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fanotes/package-lock.json
      - name: Root packages the renderer imports
        working-directory: .
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm ci --no-audit --no-fund
      - run: npm run build:spelling
      - run: node scripts/stage-main-i18n.cjs
      - name: Renderer
        run: npx vite build
      - name: Xvfb and playwright-core
        run: |
          command -v xvfb-run || (sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 xvfb)
          npm install --no-save --no-audit --no-fund playwright-core@1.65.0
          test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - name: Every frame of a note opening
        run: npm run check:famd-open-stable
      - name: Handwriting complete from the first frame of every open
        run: npm run check:ink-open-flicker
      - name: Text boxes never select text and stay put
        run: npm run check:text-field-position
      - name: Text boxes use the document formatting toolbar
        run: npm run check:text-field-toolbar
      - name: Zooming keeps the handwriting on the paper in every frame
        run: npm run check:zoom-ink-registration
      - name: A pinch paints the handwriting once, not twice
        run: npm run check:ink-double-raster
      - name: Zooming a note with many sections and handwriting stays light
        run: npm run check:zoom-sections-perf
        env:
          FANOTES_ZOOM_PERF_SLACK: '2'
