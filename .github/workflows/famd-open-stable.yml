name: Handwriting note opens stable

# Opening a .famd note in the desktop app (Electron under Xvfb): the first
# painted frame already has the final layout - typed text, page box, text
# boxes - and opening never moves a stored text box
# (fanotes/scripts/check-famd-open-stable.mjs, under a minute). Never builds
# or publishes a release.
on:
  pull_request:
    paths:
      - 'fanotes/src/App.tsx'
      - 'fanotes/src/components/PaperView.tsx'
      - 'fanotes/src/components/DrawingBoard.tsx'
      - 'fanotes/src/components/MarkdownEditor.tsx'
      - 'fanotes/src/components/NoteTextFieldLayer.tsx'
      - 'fanotes/src/components/NoteLinkLayer.tsx'
      - 'fanotes/src/lib/paper*.ts'
      - 'fanotes/src/lib/noteCanvas.ts'
      - 'fanotes/src/lib/noteTextField.ts'
      - 'fanotes/src/lib/pdfOpenCamera.ts'
      - 'fanotes/src/styles.css'
      - 'fanotes/electron/famd*'
      - 'fanotes/scripts/check-famd-open-stable.mjs'
      - '.github/workflows/famd-open-stable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fanotes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fanotes/package-lock.json
      - name: Root packages the renderer imports
        working-directory: .
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm ci --no-audit --no-fund
      - run: npm run build:spelling
      - run: node scripts/stage-main-i18n.cjs
      - name: Renderer
        run: npx vite build
      - name: Xvfb and playwright-core
        run: |
          command -v xvfb-run || (sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 xvfb)
          npm install --no-save --no-audit --no-fund playwright-core@1.65.0
          test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - name: Every frame of a note opening
        run: npm run check:famd-open-stable
