name: PDF side pages

# "Leere Seiten daneben" on PDF notes: storage format, famd round trip and
# legacy readers, the desktop app under Xvfb (toggle, page boxes, ink saved
# and reopened), and the Android read-compatibility test. Runs on pull
# requests that touch PDF notes or the famd format; never builds a release.
on:
  pull_request:
    paths:
      - 'fanotes/src/components/PdfNoteView.tsx'
      - 'fanotes/src/components/usePdfSidePages.ts'
      - 'fanotes/src/lib/pdfSidePages.ts'
      - 'fanotes/src/lib/famd.ts'
      - 'fanotes/electron/famd*.cjs'
      - 'fanotes/electron/famd*.mjs'
      - 'fanotes/scripts/check-pdf-side-pages.mjs'
      - 'fanotes/scripts/check-famd*.cjs'
      - 'android/core/src/**/famd/**'
      - '.github/workflows/pdf-side-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fanotes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fanotes/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:spelling
      - run: node scripts/stage-main-i18n.cjs
      - run: npx tsc -p tsconfig.app.json --noEmit
      # check-famd.cjs is left out: it fails on main too (an `await` assertion on App.tsx's revealOpenedNote).
      - run: node scripts/check-famd-v2.cjs
      - run: node scripts/check-famd-open.cjs
      - name: Renderer for the desktop part
        run: npx vite build
      - name: Xvfb and playwright-core
        run: |
          command -v xvfb-run || (sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 xvfb)
          npm install --no-save --no-audit --no-fund playwright-core@1.65.0
      - run: npm run check:pdf-side-pages

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: famd read compatibility (JVM core)
        working-directory: android
        run: ./gradlew :core:test --tests 'ch.fasrv.fanotes.famd.*' --no-daemon
