# Rust workspace and Tauri desktop preview on Linux and Windows.
#
# Lints and tests the Rust workspace, builds the Tauri shell as installers
# (AppImage + deb, NSIS) and launches each installed package once with
# FANOTES_SMOKE_TEST=1. The packages are workflow artifacts only: this
# workflow never tags, releases or publishes. Electron stays the release host.
name: Rust desktop

on:
  pull_request:
    branches: [main, feature/rust-desktop]
    paths:
      - "crates/**"
      - "apps/**"
      - "fanotes/src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  TAURI_CLI_VERSION: 2.12.4
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libdbus-1-dev
    patchelf file xvfb xauth

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends $LINUX_PACKAGES
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fanotes/package-lock.json
      - name: Install the test resources
        # fanotes-ort loads ONNX Runtime from onnxruntime-node, and the host's
        # spelling test reads the bundles build:spelling stages.
        working-directory: fanotes
        run: |
          npm ci --no-audit --no-fund
          npm run build:spelling
      - name: Placeholder frontend
        # `tauri::generate_context!` embeds ../dist at compile time. Lints and
        # tests do not need the real React bundle; the bundle job builds it.
        run: |
          mkdir -p fanotes/dist
          [ -f fanotes/dist/index.html ] || echo '<!doctype html><title>FaNotes</title>' > fanotes/dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        # Existing warnings are reported, not fatal. Errors fail the job.
        run: cargo clippy --locked --workspace --all-targets
      - name: Test
        # Skipped, with the reason:
        # - a_blank_line_returns_pylaia_probabilities: loads the PyLaia model
        #   through the system ONNX Runtime library, which a runner does not have.
        # - an_unreadable_folder_does_not_replace_a_hidden_file: fails on
        #   feature/rust-desktop already (create-note reports a name error
        #   instead of EACCES); fanotes-host belongs to WP1.
        # - a_traced_completion_prefers_dauern_when_the_model_agrees: reads
        #   /workspace/fanotes/public/ocr/fanotes-ink/de.fnlm, a path that only
        #   exists on one developer machine.
        # On Windows fanotes-host runs in the next step, without failing the job.
        # The GTK and WebView2 tests need a display: Xvfb on Linux, the
        # runner's desktop on Windows.
        run: |
          skip="--skip a_blank_line_returns_pylaia_probabilities --skip an_unreadable_folder_does_not_replace_a_hidden_file --skip a_traced_completion_prefers_dauern_when_the_model_agrees"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --locked --workspace --no-fail-fast -- $skip
          else
            cargo test --locked --workspace --exclude fanotes-host --no-fail-fast -- $skip
          fi
      - name: Test fanotes-host (Windows, reported only)
        # The host tests still assert Linux paths, modes and error texts in
        # many places. They run and report here until the host port (WP1)
        # makes them pass; then this step joins the one above.
        if: runner.os == 'Windows'
        run: |
          if cargo test --locked -p fanotes-host --no-fail-fast > host-tests.log 2>&1; then
            echo "fanotes-host: all tests pass on Windows."
          else
            failed="$(grep -c ' \.\.\. FAILED$' host-tests.log || true)"
            grep -E 'test result:' host-tests.log || true
            echo "::warning::fanotes-host: $failed tests fail on Windows (see the log of this step)."
            grep ' \.\.\. FAILED$' host-tests.log | sort | head -n 200
          fi

  bundle:
    name: Bundle and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: fanotes-preview-linux
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            artifact: fanotes-preview-windows
            paths: |
              target/release/bundle/nsis/*-setup.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fanotes/package-lock.json
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends $LINUX_PACKAGES
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bundle
      - name: Install frontend dependencies
        working-directory: fanotes
        run: npm ci --no-audit --no-fund
      - name: Build the React bundle
        # The same web build Electron packages (`dist:*` runs `build:web`).
        working-directory: fanotes
        run: npm run build:web
      - name: Build the Tauri installers
        # Bundling is switched on only here. tauri.conf.json keeps
        # `bundle.active: false` (check-tauri-channel-parity.mjs asserts it).
        working-directory: fanotes
        run: |
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --ci --config '{"bundle":{"active":true}}' --bundles ${{ matrix.bundles }}
      - name: Smoke test the deb
        if: runner.os == 'Linux'
        run: |
          deb="$(ls target/release/bundle/deb/*.deb | head -n1)"
          package="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install -y -o Acquire::Retries=3 "./$deb"
          dpkg -L "$package" | grep -E '/bin/|\.desktop$'
          binary="$(dpkg -L "$package" | grep -m1 '^/usr/bin/')"
          FANOTES_SMOKE_TEST=1 FANOTES_SMOKE_TIMEOUT_SECS=150 FANOTES_SMOKE_LOG="$RUNNER_TEMP/smoke-deb.log" \
            timeout 200 xvfb-run -a -s "-screen 0 1440x900x24" "$binary" || { cat "$RUNNER_TEMP/smoke-deb.log"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/smoke-deb.log"
      - name: Smoke test the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage="$(ls target/release/bundle/appimage/*.AppImage | head -n1)"
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 FANOTES_SMOKE_TEST=1 FANOTES_SMOKE_TIMEOUT_SECS=150 \
            FANOTES_SMOKE_LOG="$RUNNER_TEMP/smoke-appimage.log" \
            timeout 200 xvfb-run -a -s "-screen 0 1440x900x24" "$appimage" || { cat "$RUNNER_TEMP/smoke-appimage.log"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/smoke-appimage.log"
      - name: Smoke test the NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'FaNotes Preview\fanotes-preview.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $env:LOCALAPPDATA -Filter 'FaNotes*'; throw "not installed: $exe" }
          $env:FANOTES_SMOKE_TEST = '1'
          $env:FANOTES_SMOKE_TIMEOUT_SECS = '150'
          $log = Join-Path $env:RUNNER_TEMP 'smoke-nsis.log'
          $env:FANOTES_SMOKE_LOG = $log
          $app = Start-Process -FilePath $exe -PassThru
          $null = $app.Handle
          $exited = $app.WaitForExit(200000)
          if (Test-Path $log) { Get-Content $log }
          if (-not $exited) { $app.Kill(); throw 'the app did not exit' }
          if ($app.ExitCode -ne 0) { throw "the smoke test exited with $($app.ExitCode)" }
          Write-Output 'The installed app reported the renderer ready and exited with 0.'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
