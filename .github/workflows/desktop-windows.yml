name: Desktop Windows checks

# Runs the local MCP server check (reserved names, NTFS streams, junctions, 8.3
# names, case-insensitive exclusions) the vault watcher check (recursive
# fs.watch) and the new-folder-visible check on Windows, where these path protections matter most. Never builds
# or publishes a release.
on:
  pull_request:
    paths:
      - 'fanotes/electron/**'
      - 'fanotes/scripts/check-local-mcp.mjs'
      - 'fanotes/scripts/check-vault-watch.cjs'
      - 'fanotes/scripts/check-new-folder-visible.mjs'
      - 'fanotes/src/lib/treeSync.mjs'
      - 'fanotes/src/App.tsx'
      - 'fanotes/src/components/FileTree.tsx'
      - 'fanotes/src/lib/calendarModel.ts'
      - 'fanotes/src/lib/homeworkStore.ts'
      - 'fanotes/package-lock.json'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fanotes
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fanotes/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/check-local-mcp.mjs
        env:
          CHECK_VERBOSE: '1'
      - run: node scripts/check-vault-watch.cjs
      - run: node scripts/check-new-folder-visible.mjs
