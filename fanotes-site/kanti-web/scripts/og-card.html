<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Kanti+ share card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: 'Instrument Sans', system-ui, 'Segoe UI', sans-serif; color: #f6f8f6;
         background: radial-gradient(900px 500px at 15% 0%, #1f4d75 0%, #143552 60%, #0f2a42 100%); }
  .copy { position: absolute; left: 72px; top: 92px; width: 600px; }
  .icon { width: 120px; height: 120px; border-radius: 28px; display: block; border: 2px solid #2d5f8a; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: 104px; letter-spacing: -0.03em; font-weight: 700; margin-top: 36px; line-height: 1; }
  h1 b { color: #e7b552; font-weight: 700; }
  p { font-size: 36px; line-height: 1.25; margin-top: 24px; color: #d3dde6; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 28px; color: #e7b552; font-weight: 600; }
  .phone { position: absolute; width: 300px; height: 600px; border-radius: 34px; border: 8px solid #0b1d2e; overflow: hidden; background: #f4f5f2; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .phone img { width: 100%; display: block; }
  .p1 { left: 700px; top: 90px; }
  .p2 { left: 950px; top: 150px; }
</style></head>
<body>
  <div class="copy">
    <img class="icon" src="icon.svg" alt="">
    <h1>Kanti<b>+</b></h1>
    <p>Stundenplan, Noten, Absenzen und Pendeln für Kantischüler</p>
  </div>
  <div class="url">schulnetz.fasrv.ch</div>
  <div class="phone p1"><img src="heute.webp" alt=""></div>
  <div class="phone p2"><img src="noten.webp" alt=""></div>
</body></html>
