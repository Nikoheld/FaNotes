# schulnetz.fasrv.ch: Kanti+ im Browser (fanotes-site/kanti-web).
# The page is static, served from /opt/fanotes-site/kanti-web/dist. Only the browser API goes to
# Node (fanotes-site.service on 127.0.0.1:18185); no other site API is reachable on this host.
# DNS is a Cloudflare-proxied record; the origin answers Cloudflare and localhost only.
# Certificate: certbot with the dns-cloudflare authenticator, like the other fasrv.ch hosts.

map $http_cf_connecting_ip $kanti_web_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Search engines: the app views (behind sign-in) and the API are not indexed; the home page `/`
# (with its static intro), /about/ and the other public files are. An empty value sends no header.
map $request_uri $kanti_web_robots {
    default "";
    "~^/(stundenplan|noten|termine|absenzen|mitteilungen|pendeln|einstellungen|admin/stundenplan)/?(\?|$)" "noindex, nofollow";
    "~^/api/" "noindex, nofollow";
    "~^/\?" "noindex";
}

server {
    listen 80;
    server_name schulnetz.fasrv.ch;

    include /etc/nginx/snippets/fasrv-cloudflare-origin-only.inc;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        auth_request off;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name schulnetz.fasrv.ch;

    ssl_certificate /etc/letsencrypt/live/schulnetz.fasrv.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schulnetz.fasrv.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fasrv-cloudflare-origin-only.inc;

    auth_basic off;
    auth_request off;
    server_tokens off;
    client_max_body_size 32k;
    root /opt/fanotes-site/kanti-web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf application/xml text/xml text/plain;

    # Redirects stay relative (the origin sits behind Cloudflare on https).
    absolute_redirect off;
    error_page 404 /404.html;

    # Every response, including the API. No location below uses add_header, so these always apply.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag $kanti_web_robots always;

    # The operator's timetable PDF upload (up to 25 MB), before the general API location.
    location = /api/v1/kanti-web/admin/timetable-pdf {
        client_max_body_size 25m;
        client_body_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kanti_web_client_ip;
        proxy_set_header X-Forwarded-For $kanti_web_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_pass http://127.0.0.1:18185;
    }

    location ^~ /api/v1/kanti-web/ {
        client_max_body_size 32k;
        client_body_timeout 15s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kanti_web_client_ip;
        proxy_set_header X-Forwarded-For $kanti_web_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_pass http://127.0.0.1:18185;
    }

    # Nothing else of the site's API is served here.
    location ^~ /api/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Built assets carry a content hash in their name.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /version.json {
        expires -1;
    }

    # The public 404 page, only as the answer to a missing path.
    location = /404.html {
        internal;
        expires -1;
    }

    # The SPA shell with its static intro.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /about {
        return 301 /about/;
    }

    # Every view path (/noten, /stundenplan, ...) is the page itself (src/lib/route.ts).
    location ~ ^/(stundenplan|noten|termine|absenzen|mitteilungen|pendeln|einstellungen|admin/stundenplan)/?$ {
        expires -1;
        try_files /index.html =404;
    }

    # Public files (/, /about/, sitemap.xml, robots.txt, ...); anything else is a real 404.
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }
}
