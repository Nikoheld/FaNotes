# Only Cloudflare may tell us the visitor address. Anyone else can send any
# CF-Connecting-IP header, so it is honoured only when the TCP peer is in a
# Cloudflare range (keep in sync with https://www.cloudflare.com/ips/).
geo $fanotes_from_cf {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$fanotes_from_cf:$http_cf_connecting_ip" $fanotes_client_ip {
    default $remote_addr;
    "~^1:(?<cfip>.+)$" $cfip;
}

limit_req_zone $fanotes_client_ip zone=fanotes_diagnostics:10m rate=30r/m;

server {
    listen 80;
    server_name fanotes.fasrv.ch;

    include /etc/nginx/snippets/fasrv-cloudflare-origin-only.inc;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        auth_request off;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fanotes.fasrv.ch;

    ssl_certificate /etc/letsencrypt/live/fanotes.fasrv.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanotes.fasrv.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fasrv-cloudflare-origin-only.inc;

    # Sync metadata headers are base64 and can exceed the default 8k buffer.
    large_client_header_buffers 8 32k;

    auth_basic off;
    auth_request off;
    client_max_body_size 1m;

    # text/html is compressed by default. XML, SVG and scripts are not, and Node
    # does not compress them. wasm and downloads stay uncompressed.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ^~ /_fanotes_release/ {
        internal;
        alias /mnt/truenas/Fabio/FaNotes-Arch-x86_64/;
        sendfile on;
        tcp_nopush on;
    }

    location ^~ /api/v1/backups {
        client_max_body_size 100m;
        client_body_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18185;
    }

    # Sync: end-to-end encrypted file blobs (PDF notes up to 100 MB) plus
    # small JSON account calls. Bodies stream straight to Node so that a
    # large upload never sits in an nginx temp file.
    location ^~ /api/v1/sync/ {
        client_max_body_size 110m;
        client_body_timeout 60s;
        # Encrypted X-FaNotes-Meta is base64 and can be larger than nginx's
        # default 8k header buffer. The request-header size itself is set on
        # the server. These buffers cover the same header on the response.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18185;
    }

    location ^~ /api/v1/ai/ {
        client_max_body_size 3m;
        client_body_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /api/v1/analytics/event {
        access_log off;
        client_max_body_size 2k;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /api/v1/analytics/summary {
        auth_basic "FaNotes Statistics";
        auth_basic_user_file /etc/nginx/certs/server-apps/fabio-downloads.htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /stats {
        return 308 /stats/;
    }

    location ^~ /stats/ {
        auth_basic "FaNotes Statistics";
        auth_basic_user_file /etc/nginx/certs/server-apps/fabio-downloads.htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:18185;
    }

    # Add-on store registry for the web build. The notes CSP is same-origin
    # only, so the app reaches GitHub through these two read-only proxies
    # (raw files and the contents API). Responses are forced to text/plain
    # with nosniff and a locked CSP so a fetched file cannot run as this origin.
    location ^~ /notes/addons-registry/ {
        limit_except GET HEAD { deny all; }
        if ($request_uri ~* "(?:^|/)\\.\\.|%2e%2e|%00") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header User-Agent "FaNotes-AddonStore";
        proxy_ssl_server_name on;
        proxy_ssl_name raw.githubusercontent.com;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_max_temp_file_size 4m;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass https://raw.githubusercontent.com/;
    }

    location ^~ /notes/addons-api/ {
        limit_except GET HEAD { deny all; }
        if ($request_uri ~* "(?:^|/)\\.\\.|%2e%2e|%00") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "FaNotes-AddonStore";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass https://api.github.com/;
    }

    location ^~ /notes/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering on;
        proxy_pass http://127.0.0.1:18185;
    }

    # Usernames are saved from the desktop app, whose origin is a local file.
    # Node sends the CORS headers. This location replaces the server header
    # set, so the same-origin resource policy must not be inherited.
    location ^~ /api/v1/profile {
        client_max_body_size 64k;
        client_body_timeout 15s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /api/v1/send-data {
        client_max_body_size 64k;
        client_body_timeout 15s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_pass http://127.0.0.1:18185;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location ~ ^/api/v1/diagnostics(/[0-9a-f]{32})?$ {
        limit_req zone=fanotes_diagnostics burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_timeout 15s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        # The site process sets its own CORS headers; hide them so only nginx's copy remains.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass http://127.0.0.1:18185;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    # Work requests ("Fehler & Wünsche"): owner API with an SSE stream. Buffering is
    # off and the read timeout is longer than the 15 s heartbeat. Screenshots arrive as
    # base64 JSON, hence the 3.6 MB body limit.
    location ^~ /api/v1/requests {
        client_max_body_size 3700k;
        client_body_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass http://127.0.0.1:18185;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-FaNotes-Account, Last-Event-ID" always;
    }

    # The worker talks to the same API over the public name with its own bearer token.
    location ^~ /api/v1/worker/ {
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:18185;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Grok custom connector. OAuth metadata, the consent page and the MCP
    # endpoint stay small; the device bridge may long-poll, so the read
    # timeout is longer than a normal page and buffering stays off.
    location = /.well-known/oauth-protected-resource {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass http://127.0.0.1:18185;
    }

    location ^~ /oauth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:18185;
    }

    location = /mcp {
        client_max_body_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18185;
    }

    location ^~ /api/v1/mcp/ {
        client_max_body_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:18185;
    }

    # Public note links. A folder payload may be 8 MB; the server default of
    # 1m would reject that PUT before Node stores the notes. The desktop app
    # uploads from a local file origin, so this location must not inherit the
    # same-origin resource policy. Node sends the CORS headers. The viewer at
    # /share/ stays on the page policy and loads its script and style as files.
    location ^~ /api/v1/share/ {
        client_max_body_size 8m;
        client_body_timeout 60s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:18185;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fanotes_client_ip;
        proxy_set_header X-Forwarded-For $fanotes_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering on;
        proxy_pass http://127.0.0.1:18185;
    }
}
