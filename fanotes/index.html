<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="FaNotes Web – Markdown, Handschrift, Mathematik und Arbeitsblätter direkt im Browser." />
    <meta name="application-name" content="FaNotes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FaNotes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./fanotes-app.svg" type="image/svg+xml" />
    <title>FaNotes</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #f7f6f3; color: #37352f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot-surface { width: 100%; height: 100%; display: grid; place-items: center; background: #f7f6f3; }
      .boot-card { display: grid; justify-items: center; gap: 12px; }
      .boot-mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 10px; background: #37352f; color: #fff; font-size: 24px; font-weight: 650; }
      .boot-card strong { font-size: 15px; letter-spacing: -.02em; }
      .boot-card small { color: #5e5c57; font-size: 12px; }
      .boot-progress { width: 128px; height: 3px; overflow: hidden; border-radius: 99px; background: #e3e2de; }
      .boot-progress::after { content: ''; display: block; width: 48%; height: 100%; border-radius: inherit; background: #37352f; animation: boot-slide 1s ease-in-out infinite alternate; }
      @keyframes boot-slide { to { transform: translateX(140%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-surface"><div class="boot-card"><div class="boot-mark">F</div><strong>FaNotes</strong><small data-boot-status>Arbeitsbereich wird geöffnet</small><div class="boot-progress"></div></div></div></div>
    <script type="module" src="/src/boot-language.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
