# Spike S1 (do not merge): the unchanged FaNotes bundle on Tauri 3 alpha +
# tauri-runtime-cef (Chromium through CEF). Its own workspace, so the alpha
# crates, GTK 4 and CEF never enter the main workspace's lockfile or CI.
[package]
name = "fanotes-tauri-cef"
version = "0.0.0"
description = "Spike S1: Tauri 3 + CEF shell for the FaNotes React bundle"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
# No GTK 3 in this process: GTK 4 (which the CEF runtime uses) aborts when both are loaded.
fanotes-host = { path = "../../crates/fanotes-host", default-features = false, features = ["dialogs-portal"] }
serde_json = "1"
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 4
