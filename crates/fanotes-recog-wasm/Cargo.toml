[package]
name = "fanotes-recog-wasm"
version = "0.1.0"
description = "wasm-bindgen facade of the shared PyLaia line tensor and CTC decoder"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fanotes-recog = { path = "../fanotes-recog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
