[package]
name = "fanotes-spell-wasm"
version = "0.1.0"
description = "wasm-bindgen facade of the spelling lexicon, correction candidates and word context index"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fanotes-spell = { path = "../fanotes-spell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
