[package]
name = "fanotes-host"
version = "0.1.0"
description = "Tauri host for FaNotesApi, mapped from the Electron preload channels"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fanotes-famd = { path = "../fanotes-famd" }
fanotes-ort = { path = "../fanotes-ort" }
fanotes-pdf = { path = "../fanotes-pdf" }
base64 = "0.22"
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
