[package]
name = "fanotes-host"
version = "0.1.0"
description = "Tauri host for FaNotesApi, mapped from the Electron preload channels"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fanotes-famd = { path = "../fanotes-famd" }
fanotes-ort = { path = "../fanotes-ort" }
fanotes-pdf = { path = "../fanotes-pdf" }
base64 = "0.22"
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.2"
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
keyring = "4.2.0"
libc = "0.2"
url = "2.5"
icu_collator = "2.3"
icu_locale_core = "2.3"
# Electron profile migration (src/migrate): AES for safeStorage values.
aes = "0.9"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Electron profile migration: the v11 safeStorage password in the Secret Service or KWallet.
secret-service = { version = "5.2", default-features = false, features = ["crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
# Win32_Security_Cryptography and Win32_System_Memory: the DPAPI-protected
# safeStorage key for the Electron profile migration.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
filetime = "0.2"
