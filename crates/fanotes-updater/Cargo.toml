[package]
name = "fanotes-updater"
version = "0.1.0"
description = "Signed update manifests, channels, SHA-256 and delta apply: a port of electron/updater.cjs and delta.cjs"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Real HTTPS fetcher (reqwest blocking + rustls). Tests never use it.
reqwest-fetcher = ["dep:reqwest"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"] }
regex = "1"
serde_json = "1"
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"] }
tempfile = "3"
