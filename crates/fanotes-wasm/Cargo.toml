[package]
name = "fanotes-wasm"
version = "0.1.0"
description = "wasm-bindgen exports of the FaNotes paper reducer, grow, and remap"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fanotes-paper = { path = "../fanotes-paper" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
